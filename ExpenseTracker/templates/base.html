<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Tracker</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>


</head>

<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
  <div class="container-fluid">

    <a class="navbar-brand" href="#">Expense Tracker</a>

    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav ms-auto">

        <li class="nav-item">
          <a class="nav-link " href="{% url 'index' %}">Home</a>
        </li>

        <li class="nav-item">
          <a class="nav-link" href="{% url 'addexpense' %}">Add Expenses</a>
        </li>
         <li class="nav-item">
          <a class="nav-link " href="{% url 'home' %}">View Expense</a>
        </li>



        
        {% if request.user.is_authenticated %}
        
        <!-- USER PROFILE LINK WITH ICON -->
        <li class="nav-item">
          <a class="nav-link d-flex align-items-center gap-1" href="#">
            <i class="bi bi-person-circle"></i>
            {{ request.user.username }}
          </a>
        </li>

        <!-- LOGOUT -->
        <li class="nav-item">
          <a class="nav-link text-danger" href="{% url 'signout' %}">
            Logout
          </a>
        </li>

        {% else %}

        <!-- LOGIN -->
        <li class="nav-item">
          <a class="nav-link" href="{% url 'signin' %}">
            Login
          </a>
        </li>

        {% endif %}

      </ul>
    </div>

  </div>
</nav>


<div class="container mt-4">
  {% block main_block %}
  {% endblock %}
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
