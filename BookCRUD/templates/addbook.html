{% extends 'base.html' %}
{% load static %}

{% block main_block %}

<!-- Book [ id, title, author, price, language, genre, year] -->
<div class="d-flex justify-content-center mt-5">
  <div class="card p-4 shadow" style="width: 700px;">
    <h2 class="text-center mb-4">Add Book</h2>

    <form class="needs-validation" novalidate id="bookForm" method="post" action="" enctype="multipart/form-data">
        {% csrf_token %}
      <div class="row">

        <div class="col-md-6 mb-3">
          <label for="title">Title</label>
          <input type="text" class="form-control" id="title" name="title" placeholder="Title" required>
          <div class="invalid-feedback">Required field</div>
        </div>

        <div class="col-md-6 mb-3">
          <label for="author">Author</label>
          <input type="text" class="form-control" id="author" name="author" placeholder="Author" required>
          <div class="invalid-feedback">Required field</div>
        </div>

        <div class="col-md-6 mb-3">
          <label for="price">Price</label>
          <input type="number" class="form-control" id="price" name="price" placeholder="Price" required>
          <div class="invalid-feedback">Required field</div>
        </div>

        <div class="col-md-6 mb-3">
          <label for="language">Language</label>
          <input type="text" class="form-control" id="language" name="language" placeholder="Language" required>
          <div class="invalid-feedback">Required field</div>
        </div>

        <div class="col-md-6 mb-3">
          <label for="genre">Genre</label>
          <input type="text" class="form-control" id="genre" name="genre" placeholder="Genre" required>
          <div class="invalid-feedback">Required field</div>
        </div>

        <div class="col-md-6 mb-3">
          <label for="year">Year</label>
          <input type="number" class="form-control" id="year" name="year" placeholder="Year" required>
          <div class="invalid-feedback">Required field</div>
        </div>

        <!-- Image Upload -->
        <div class="col-12 mb-3">
          <label for="image" class="form-label">Book Image (optional)</label>
          <input type="file" class="form-control" id="image" name="image" accept="image/*">
          <div class="form-text">Allowed types: jpg, png, gif. Max size: 2MB.</div>
          <div class="invalid-feedback" id="imageInvalid">Please select a valid image (≤ 2MB).</div>
        </div>

        <!-- Preview -->
        <div class="col-12 mb-3 text-center" id="previewWrap" style="display:none;">
          <p class="mb-1">Image preview:</p>
          <!-- data-default-src contains the local path you uploaded -->
          <img id="imagePreview" src="" data-default-src="/mnt/data/18e834da-8e6d-4bbb-a718-e0e81a739cb3.png" alt="Image preview" class="img-fluid rounded" style="max-height:240px;">
        </div>

      </div>

      <button class="btn btn-primary w-100" type="submit">Add book</button>

    </form>
  </div>
</div>

<script>
(function () {
  'use strict';

  const form = document.getElementById('bookForm');
  const fileInput = document.getElementById('image');
  const previewWrap = document.getElementById('previewWrap');
  const previewImg = document.getElementById('imagePreview');

  const MAX_BYTES = 2 * 1024 * 1024; // 2MB
  const ALLOWED_TYPES = ['image/jpeg', 'image/png', 'image/gif'];

  // if you want to show a local default (debug) preview before user picks a file,
  // uncomment the next two lines — currently we keep it hidden until a file is chosen.
  // previewImg.src = previewImg.dataset.defaultSrc;
  // previewWrap.style.display = 'block';

  fileInput.addEventListener('change', function () {
    previewWrap.style.display = 'none';
    previewImg.src = '';

    const file = this.files && this.files[0];
    if (!file) return;

    if (!ALLOWED_TYPES.includes(file.type) || file.size > MAX_BYTES) {
      this.classList.add('is-invalid');
      return;
    }
    this.classList.remove('is-invalid');
    const reader = new FileReader();
    reader.onload = e => {
      previewImg.src = e.target.result;
      previewWrap.style.display = 'block';
    };
    reader.readAsDataURL(file);
  });

  form.addEventListener('submit', function (event) {
    if (!form.checkValidity()) {
      event.preventDefault();
      event.stopPropagation();
    }

    // check file validity (if provided)
    const f = fileInput.files && fileInput.files[0];
    if (f && (f.size > MAX_BYTES || !ALLOWED_TYPES.includes(f.type))) {
      event.preventDefault();
      event.stopPropagation();
      fileInput.classList.add('is-invalid');
    }

    form.classList.add('was-validated');
  }, false);
})();
</script>

{% endblock %}
